name: Gerar APK de depuração

# Roda sozinho a cada envio para a branch main e também manualmente
# (aba Actions > "Gerar APK de depuração" > Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar o Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar o APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --console=plain

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: EduPonto-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
